<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="一场黑底代码雨里的中秋祝福。">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>中秋快乐</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='9' y='48' fill='%23e9f4ef' font-size='48'%3E%E4%B8%AD%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="./style.css">
    <script defer src="./script.js"></script>
  </head>
  <body>
    <div class="app" id="app">
      <main class="scene" id="scene" aria-label="中秋祝福代码雨">
        <canvas class="canvas canvas-rain" id="rain-canvas" aria-hidden="true"></canvas>
        <canvas class="canvas canvas-particles" id="particle-canvas" aria-hidden="true"></canvas>
      </main>

      <button class="music-toggle" id="music-toggle" type="button" aria-label="播放背景音乐" aria-pressed="false" hidden>
        <span aria-hidden="true">♫</span>
      </button>

      <p class="sr-only" id="sr-status" aria-live="polite" aria-atomic="true">中秋祝福准备中</p>
      <noscript><p class="no-script-message">中秋快乐</p></noscript>
    </div>
  </body>
</html>
